        for idx, row in orders_to_show.iterrows():
            with st.container():
                st.markdown(f"##### Order ID: `{row['OrderID']}` — {row['Outlet']}")
                col1, col2, col3 = st.columns([2, 2, 2])

                col1.write(f"👤 **Recipient:** {row['Recipient Name']}\n📞 {row['Recipient Phone']}\n📧 {row['Recipient Email']}")
                col2.write(f"📦 **Item:** {row['Product Name']} ({row['Quantity']} Boxes)\n🏷️ **Batch:** `{row['Batch Number']}`\n💰 **Total:** UGX {row['Total Amount (UGX)']:,.0f}")
                col3.write(f"Status: **{row['Status']}**\nPayment: **{row['Payment Status']}**\nItem Detection: **{row['Item Verified']}**\nTimestamp: *{row['Delivery Time']}*")

                if row["Status"] != "Delivered":
                    st.file_uploader(f"Upload POD Image ({row['OrderID']})", type=["png", "jpg", "pdf"], key=f"file_{row['OrderID']}")

                    col_btn1, col_btn2 = st.columns(2)
                    with col_btn1:
                        if st.button(f"🚚 Trigger Delivered & Send Email", key=f"deliv_btn_{row['OrderID']}", type="primary"):
                            exact_time_now = datetime.datetime.now().strftime("%Y-%m-%d %I:%M:%S %p")
                            
                            real_idx = db["orders"][db["orders"]["OrderID"] == row["OrderID"]].index[0]
                            db["orders"].at[real_idx, "Status"] = "Delivered"
                            db["orders"].at[real_idx, "Delivery Time"] = exact_time_now
                            db["orders"].at[real_idx, "Payment Status"] = "Paid on Delivery"
                            db["orders"].at[real_idx, "Item Verified"] = "Verified Correct Item"
                            
                            # Trigger Automatic Email Dispatch to Customer
                            email_sent, email_msg = send_delivery_email(
                                recipient_email=row["Recipient Email"],
                                recipient_name=row["Recipient Name"],
                                order_id=row["OrderID"],
                                product_name=row["Product Name"],
                                quantity=row["Quantity"],
                                total_amount=row["Total Amount (UGX)"],
                                delivery_time=exact_time_now
                            )
                            
                            st.success(f"Delivery & Payment confirmed for {row['Recipient Name']} at {exact_time_now}!")
                            st.info(f"📧 **Automatic Notification:** {email_msg}")
                            st.rerun()
                    with col_btn2:
                        if st.button(f"❌ Detect Mismatch Item", key=f"mismatch_{row['OrderID']}"):
                            real_idx = db["orders"][db["orders"]["OrderID"] == row["OrderID"]].index[0]
                            db["orders"].at[real_idx, "Item Verified"] = "⚠️ Wrong Item Flagged"
                            st.error(f"Mismatch flagged for Order {row['OrderID']}!")
                            st.rerun()
                else:
                    st.write(f"✅ **Delivery Confirmed at {row['Delivery Time']}** | **Payment: {row['Payment Status']}** | **Detection: {row['Item Verified']}**")
                st.divider()

    render_live_seller_dashboard()

